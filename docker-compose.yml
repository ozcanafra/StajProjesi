services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentrascan
      POSTGRES_PASSWORD: sentrascan
      POSTGRES_DB: sentrascan
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrascan"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Yerel LLM sunucusu - AI rapor/chat katmani bunu kullanir.
  # Ilk kalkista model indirilmedigi icin rapor katmani fallback'e duser;
  # modeli bir kez indirmek gerekir:
  #   docker compose exec ollama ollama pull qwen2.5:3b
  #
  # backend/worker bu servise bilerek depends_on ile baglanmadi: Ollama
  # ayakta olsa bile model indirilmemis olabilecegi icin "started" durumu
  # bir garanti vermiyor, uygulama zaten ulasamadiginda fallback rapora
  # dusuyor. Boylece Ollama'yi host'a kurup `--scale ollama=0` ile bu
  # servisi kapatmak da sorunsuz calisiyor.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
  ollama_data:
